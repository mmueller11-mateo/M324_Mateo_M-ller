name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Exercise2
    steps:
      - name: Checkout code
        uses: actions/checkout@<FULL_SHA_V6_ODER_NEUER>  # Version + SHA selbst verifizieren

      - name: Set up Node.js
        uses: actions/setup-node@<FULL_SHA>  # dito
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Exercise2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test
